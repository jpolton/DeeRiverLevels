name: Refresh JSON for GitHub Pages

on:
  schedule:
    - cron: "7,37 * * * *"   # run at :07 and :37 past the hour (UTC), avoids peak contention
  workflow_dispatch:

jobs:
  build-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit JSON back to the repo
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install Flask pandas requests numpy python-dateutil
          

      - name: Generate station DB
        env:
          OUT_DIR: docs/data
          NDAYS: "7"
          # Add API keys as needed via repository "Actions secrets"
          NRW_KEY: ${{ secrets.NRW_KEY }}
        run: |
          python scripts/db_updater.py --db docs/data/timeseries.sqlite --once --days 7 --log-file docs/data/test_update.log
          
      - name: Generate station JSON
        run: |
          python scripts/db_to_json.py --db docs/data/timeseries.sqlite --output-dir docs/data

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json docs/data/test_update.log
          git commit -m "Update JSON ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))" || echo "No changes"
          git push

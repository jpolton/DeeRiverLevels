name: Refresh JSON for GitHub Pages

on:
  schedule:
    # run at :07, 22, 37, 52  past the hour (UTC), between 11 and 2pm to avoids peak contention
    - cron: "7,22,37,52 11-14 * * *"
    # run every 30mins outside the midday window, in day time.
    - cron: "22,52 7-10,15-22 * * *"
    # don't run at night between ~11pm and 7am
    
  workflow_dispatch:

jobs:
  build-json:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: write  # needed to commit JSON back to the repo
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install Flask pandas requests numpy python-dateutil
          

      - name: Clear daily log
        run: |
          LOG=docs/data/test_update.log
          if [ -f "$LOG" ] && [ -s "$LOG" ]; then
              # read last line of file
              last_line=$(tail -n 1 "$LOG")
              # extract first 10 chars: YYYY-MM-DD
              log_date=${last_line:0:10}
              # today's date in UTC (to match your timestamp style)
              today=$(date -u +%Y-%m-%d)
              if [ "$log_date" != "$today" ]; then
                  echo "New day detected ($log_date -> $today), clearing log."
                  : > "$LOG"
              else
                  echo "Same day ($today), keeping existing log."
              fi
          else
              echo "Log file missing or empty — nothing to clear."
          fi

      - name: Generate station DB
        env:
          OUT_DIR: docs/data
          NDAYS: "7"
          # Add API keys as needed via repository "Actions secrets"
          NRW_KEY: ${{ secrets.NRW_KEY }}
        run: |
          python scripts/db_updater.py --db docs/data/timeseries.sqlite --once --days 7 --log-file docs/data/test_update.log
          
      - name: Generate station JSON
        run: |
          python scripts/db_to_json.py --db docs/data/timeseries.sqlite --output-dir docs/data

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json docs/data/test_update.log docs/data/timeseries.sqlite
          git commit -m "Update JSON ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))" || echo "No changes"
          
          # safe fast‑forward pull
          git pull --ff-only

          git push
